<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario para editar un producto existente en Accesorios Shop.">
    <title>Editar producto | Accesorios Shop</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header></header>

    <main id="editar-producto">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
            <ol>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="administrador.html">Administración</a></li>
                <li aria-current="page">Editar producto</li>
            </ol>
        </nav>

        <h1>Editar producto</h1>

        <form action="administrador.html" method="post" enctype="multipart/form-data">
            <div class="campo">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" name="nombre" value="Reloj clásico" required>
            </div>

            <div class="campo">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="4" required>Reloj analógico con correa de cuero.</textarea>
            </div>

            <div class="campo">
                <label for="precio">Precio</label>
                <input type="number" id="precio" name="precio" min="0" step="0.01" value="49999" required>
            </div>

            <div class="campo">
                <label for="imagen">Imagen del producto</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">
            </div>

            <button type="submit">Guardar cambios</button>
        </form>
    </main>

    <footer></footer>
    <script src="assets/js/header-footer.js"></script>
</body>
</html>
