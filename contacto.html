<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactate con Accesorios Shop para consultas, sugerencias o pedidos especiales.">
    <title>Contacto | Accesorios Shop</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header>
        <a href="index.html" aria-label="Ir al inicio">
            <img class="logo" src="assets/img/2.png" alt="Logo de Accesorios Shop" width="48" height="48">
        </a>

        <nav class="navbar" aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Ofertas</a></li>
                <li><a class="activo" href="contacto.html" aria-current="page">Contacto</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main id="contacto">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
            <ol>
                <li><a href="index.html">Inicio</a></li>
                <li aria-current="page">Contacto</li>
            </ol>
        </nav>

        <h1>Contactanos</h1>

        <form action="#" method="post">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: María García" autocomplete="name" required>
            </div>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Ej: maria@correo.com" autocomplete="email" required>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 11 4567 8901" autocomplete="tel" required>
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribí tu consulta o mensaje..." required></textarea>
            </div>

            <button type="submit">Enviar mensaje</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Accesorios Shop. Todos los derechos reservados.</p>
        <nav aria-label="Redes sociales">
            <ul>
                <li><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
                <li><a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">Facebook</a></li>
                <li><a href="https://x.com/" target="_blank" rel="noopener noreferrer">X (Twitter)</a></li>
                <li><a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">TikTok</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
