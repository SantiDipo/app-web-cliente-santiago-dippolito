<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Búsqueda y filtros de productos en Accesorios Shop.">
    <title>Buscar productos | Accesorios Shop</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header></header>

    <main id="resultados-busqueda">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
            <ol>
                <li><a href="index.html">Inicio</a></li>
                <li aria-current="page">Buscar productos</li>
            </ol>
        </nav>

        <h1>Buscar productos</h1>
        <p class="resultado-info">Mostrando 10 productos</p>

        <div class="busqueda-layout">
            <aside id="filtros-busqueda" aria-label="Filtros de búsqueda">
                <h2 class="sr-only">Filtros de búsqueda</h2>

                <form action="busqueda.html" method="get" aria-label="Filtrar productos">
                    <div class="campo">
                        <label for="busqueda-filtros">Buscar</label>
                        <input type="search" id="busqueda-filtros" name="busqueda" placeholder="Ej: reloj clásico">
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" name="categoria">
                            <option value="todas">Todas</option>
                            <option value="relojes">Relojes</option>
                            <option value="bolsos">Bolsos</option>
                            <option value="gorras">Gorras</option>
                            <option value="lentes">Lentes de sol</option>
                            <option value="joyeria">Joyería</option>
                            <option value="accesorios">Accesorios</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="orden">Ordenar por</label>
                        <select id="orden" name="orden">
                            <option value="mas-vendido">Más vendido</option>
                            <option value="precio-mayor-menor">Precio: mayor a menor</option>
                            <option value="precio-menor-mayor">Precio: menor a mayor</option>
                            <option value="a-z">A-Z</option>
                            <option value="z-a">Z-A</option>
                            <option value="mas-nuevo">Más nuevo a más viejo</option>
                            <option value="mas-viejo">Más viejo a más nuevo</option>
                        </select>
                    </div>

                    <fieldset>
                        <legend>Disponibilidad</legend>
                        <label>
                            <input type="checkbox" name="disponibilidad" value="en-stock">
                            En stock
                        </label>
                        <label>
                            <input type="checkbox" name="disponibilidad" value="agotado">
                            Agotados
                        </label>
                    </fieldset>

                    <button type="submit">Aplicar filtros</button>
                </form>
            </aside>

            <section id="catalogo" aria-labelledby="titulo-resultados">
                <h2 id="titulo-resultados">Productos</h2>
                <ul></ul>
            </section>
        </div>
    </main>

    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/header-footer.js"></script>
    <script src="assets/js/productos.js"></script>
    <script src="assets/js/carrito.js"></script>
</body>
</html>
