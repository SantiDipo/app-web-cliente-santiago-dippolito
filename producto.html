<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalle del producto en Accesorios Shop.">
    <title>Detalle de producto | Accesorios Shop</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header></header>

    <main id="detalle-producto">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
            <ol>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#catalogo">Catálogo</a></li>
                <li aria-current="page" id="miga-producto">Producto</li>
            </ol>
        </nav>

        <p class="aviso-detalle" id="aviso-detalle" hidden></p>

        <article id="detalle-articulo" hidden>
            <img id="detalle-imagen" src="" alt="" width="400" height="400">

            <div class="detalle-info">
                <h1 id="detalle-nombre"></h1>
                <p class="precio" id="detalle-precio"></p>
                <p class="descripcion" id="detalle-descripcion"></p>

                <ul class="caracteristicas" id="detalle-caracteristicas"></ul>

                <p class="stock" id="detalle-stock"></p>

                <form action="carrito.html" method="get" id="detalle-formulario">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad" value="1" min="1">
                    <input type="hidden" name="producto" id="detalle-id" value="">
                    <button type="submit">Agregar al carrito</button>
                </form>

                <p class="acciones-detalle">
                    <a href="administrador.html" id="enlace-volver-admin" hidden>Volver a administración</a>
                    <a href="editar-producto.html" id="enlace-editar-admin" hidden>Editar este producto</a>
                </p>
            </div>
        </article>

        <section id="relacionados" aria-labelledby="titulo-relacionados" hidden>
            <h2 id="titulo-relacionados">Productos relacionados</h2>
            <ul></ul>
        </section>
    </main>

    <footer></footer>
    <script src="assets/js/header-footer.js"></script>
    <script src="assets/js/productos.js"></script>
</body>
</html>
