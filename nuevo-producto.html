<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario para crear un nuevo producto en Accesorios Shop.">
    <title>Nuevo producto | Accesorios Shop</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header></header>

    <main id="nuevo-producto">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
            <ol>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li aria-current="page">Nuevo producto</li>
            </ol>
        </nav>

        <h1>Crear nuevo producto</h1>

        <form action="#" method="post" enctype="multipart/form-data">
            <div class="campo">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Reloj clásico" required>
            </div>

            <div class="campo">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Describe las características del producto..." required></textarea>
            </div>

            <div class="campo">
                <label for="precio">Precio</label>
                <input type="number" id="precio" name="precio" min="0" step="0.01" placeholder="Ej: 49999.99" required>
            </div>

            <div class="campo">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria">
                    <option value="relojes">Relojes</option>
                    <option value="bolsos">Bolsos</option>
                    <option value="gorras">Gorras</option>
                    <option value="lentes">Lentes de sol</option>
                    <option value="joyeria">Joyería</option>
                    <option value="accesorios" selected>Accesorios</option>
                </select>
            </div>

            <div class="campo">
                <label for="imagen">Imagen del producto</label>
                <input type="file" id="imagen" name="imagen" accept="image/*" required>
            </div>

            <button type="submit">Crear producto</button>
        </form>
    </main>

    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/header-footer.js"></script>
    <script src="assets/js/productos.js"></script>
</body>
</html>
