<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario para crear un nuevo producto en Accesorios Shop.">
    <title>Nuevo producto | Accesorios Shop</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header>
        <a href="index.html" aria-label="Ir al inicio">
            <img class="logo" src="assets/img/2.png" alt="Logo de Accesorios Shop" width="48" height="48">
        </a>

        <nav class="navbar" aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Ofertas</a></li>
                <li><a href="#">Contacto</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main id="nuevo-producto">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
            <ol>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li aria-current="page">Nuevo producto</li>
            </ol>
        </nav>

        <h1>Crear nuevo producto</h1>

        <form action="#" method="post" enctype="multipart/form-data">
            <div class="campo">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Reloj clásico" required>
            </div>

            <div class="campo">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Describe las características del producto..." required></textarea>
            </div>

            <div class="campo">
                <label for="precio">Precio</label>
                <input type="number" id="precio" name="precio" min="0" step="0.01" placeholder="Ej: 49999.99" required>
            </div>

            <div class="campo">
                <label for="imagen">Imagen del producto</label>
                <input type="file" id="imagen" name="imagen" accept="image/*" required>
            </div>

            <button type="submit">Crear producto</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Accesorios Shop. Todos los derechos reservados.</p>
        <nav aria-label="Redes sociales">
            <ul>
                <li><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
                <li><a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">Facebook</a></li>
                <li><a href="https://x.com/" target="_blank" rel="noopener noreferrer">X (Twitter)</a></li>
                <li><a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">TikTok</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
