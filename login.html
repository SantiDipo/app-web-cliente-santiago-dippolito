<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciá sesión en Accesorios Shop para gestionar tu cuenta.">
    <title>Iniciar sesión | Accesorios Shop</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header>
        <a href="index.html" aria-label="Ir al inicio">
            <img class="logo" src="assets/img/2.png" alt="Logo de Accesorios Shop" width="48" height="48">
        </a>

        <input type="checkbox" id="menu-movil-toggle" class="menu-toggle sr-only">
        <label for="menu-movil-toggle" class="menu-hamburguesa">
            <span class="sr-only">Abrir menú de navegación</span>
            <svg class="icono-hamburguesa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="4" y1="6" x2="20" y2="6"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
            <svg class="icono-cerrar" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
        </label>

        <nav id="menu-movil" class="navbar" aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li class="buscar-producto"><a href="busqueda.html">Buscar producto</a></li>
            </ul>
        </nav>
    </header>

    <main id="login">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
            <ol>
                <li><a href="index.html">Inicio</a></li>
                <li aria-current="page">Iniciar sesión</li>
            </ol>
        </nav>

        <h1>Iniciar sesión</h1>

        <form action="index.html" method="get">
            <div class="campo">
                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ej: maria_garcia" autocomplete="username" required>
            </div>

            <div class="campo">
                <label for="contrasenia">Contraseña</label>
                <input type="password" id="contrasenia" name="contrasenia" placeholder="Ingresá tu contraseña" autocomplete="current-password" required>
            </div>

            <button type="submit">Iniciar sesión</button>
            <a class="boton-crear-cuenta" href="#">¿No tenés cuenta? Crear cuenta</a>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Accesorios Shop. Todos los derechos reservados.</p>
        <nav aria-label="Redes sociales">
            <ul>
                <li><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
                <li><a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">Facebook</a></li>
                <li><a href="https://x.com/" target="_blank" rel="noopener noreferrer">X (Twitter)</a></li>
                <li><a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">TikTok</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
