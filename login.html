<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciá sesión en Accesorios Shop para gestionar tu cuenta.">
    <title>Iniciar sesión | Accesorios Shop</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header></header>

    <main id="login">
        <nav class="breadcrumb" aria-label="Ruta de navegación">
            <ol>
                <li><a href="index.html">Inicio</a></li>
                <li aria-current="page">Iniciar sesión</li>
            </ol>
        </nav>

        <h1>Iniciar sesión</h1>

        <form action="administrador.html" method="get">
            <div class="campo">
                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ej: maria_garcia" autocomplete="username" required>
            </div>

            <div class="campo">
                <label for="contrasenia">Contraseña</label>
                <input type="password" id="contrasenia" name="contrasenia" placeholder="Ingresá tu contraseña" autocomplete="current-password" required>
            </div>

            <button type="submit">Iniciar sesión</button>
            <a class="boton-crear-cuenta" href="#">¿No tenés cuenta? Crear cuenta</a>
        </form>
    </main>

    <footer></footer>
    <script src="assets/js/header-footer.js"></script>
</body>
</html>
